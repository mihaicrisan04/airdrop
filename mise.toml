[env]
APP_NAME    = "Airdrop"
BUILD_DIR   = "build"
INSTALL_DIR = "{{env.HOME}}/Applications"
BIN_DIR     = "{{env.HOME}}/.local/bin"
LSREGISTER  = "/System/Library/Frameworks/CoreServices.framework/Versions/A/Frameworks/LaunchServices.framework/Versions/A/Support/lsregister"

[tasks.icon]
description = "generate AppIcon.icns from AppIcon.png"
sources = ["AppIcon.png"]
outputs = ["build/AppIcon.icns"]
run = '''
if [ ! -f AppIcon.png ]; then
    echo "AppIcon.png missing, skipping icon generation"
    exit 0
fi
mkdir -p "$BUILD_DIR/AppIcon.iconset"
ISET="$BUILD_DIR/AppIcon.iconset"
sips -z 16   16   AppIcon.png --out "$ISET/icon_16x16.png"      >/dev/null
sips -z 32   32   AppIcon.png --out "$ISET/icon_16x16@2x.png"   >/dev/null
sips -z 32   32   AppIcon.png --out "$ISET/icon_32x32.png"      >/dev/null
sips -z 64   64   AppIcon.png --out "$ISET/icon_32x32@2x.png"   >/dev/null
sips -z 128  128  AppIcon.png --out "$ISET/icon_128x128.png"    >/dev/null
sips -z 256  256  AppIcon.png --out "$ISET/icon_128x128@2x.png" >/dev/null
sips -z 256  256  AppIcon.png --out "$ISET/icon_256x256.png"    >/dev/null
sips -z 512  512  AppIcon.png --out "$ISET/icon_256x256@2x.png" >/dev/null
sips -z 512  512  AppIcon.png --out "$ISET/icon_512x512.png"    >/dev/null
sips -z 1024 1024 AppIcon.png --out "$ISET/icon_512x512@2x.png" >/dev/null
iconutil -c icns "$ISET" -o "$BUILD_DIR/AppIcon.icns"
rm -rf "$ISET"
echo "generated $BUILD_DIR/AppIcon.icns"
'''

[tasks.build]
description = "build Airdrop.app bundle"
depends = ["icon"]
sources = ["Sources/main.swift", "Info.plist", "AppIcon.png"]
outputs = ["build/Airdrop.app/Contents/MacOS/airdrop"]
run = '''
RES="$BUILD_DIR/$APP_NAME.app/Contents/Resources"
mkdir -p "$BUILD_DIR/$APP_NAME.app/Contents/MacOS" "$RES"
cp Info.plist "$BUILD_DIR/$APP_NAME.app/Contents/Info.plist"
if [ -f "$BUILD_DIR/AppIcon.icns" ]; then
    cp "$BUILD_DIR/AppIcon.icns" "$RES/AppIcon.icns"
fi
swiftc -O -framework AppKit -o "$BUILD_DIR/$APP_NAME.app/Contents/MacOS/airdrop" Sources/main.swift
codesign --force --sign - "$BUILD_DIR/$APP_NAME.app"
echo "built $BUILD_DIR/$APP_NAME.app"
'''

[tasks.install]
description = "install Airdrop.app to ~/Applications and 'ad' to ~/.local/bin"
depends = ["build"]
run = '''
mkdir -p "$INSTALL_DIR"
rm -rf "$INSTALL_DIR/$APP_NAME.app"
cp -R "$BUILD_DIR/$APP_NAME.app" "$INSTALL_DIR/"
"$LSREGISTER" -f "$INSTALL_DIR/$APP_NAME.app"

mkdir -p "$BIN_DIR"
cat > "$BIN_DIR/ad" <<EOF
#!/bin/sh
exec "\$HOME/Applications/$APP_NAME.app/Contents/MacOS/airdrop" "\$@"
EOF
chmod +x "$BIN_DIR/ad"

echo "installed:"
echo "  $INSTALL_DIR/$APP_NAME.app"
echo "  $BIN_DIR/ad"

case ":$PATH:" in
  *":$BIN_DIR:"*) ;;
  *)
    echo
    echo "warning: $BIN_DIR is not in your PATH"
    echo "add this to your shell profile:"
    echo "  export PATH=\"\$HOME/.local/bin:\$PATH\""
    ;;
esac
'''

[tasks.uninstall]
description = "remove Airdrop.app and 'ad' wrapper"
run = '''
rm -rf "$INSTALL_DIR/$APP_NAME.app"
rm -f "$BIN_DIR/ad"
echo "removed $INSTALL_DIR/$APP_NAME.app and $BIN_DIR/ad"
'''

[tasks.test]
description = "run smoke tests"
depends = ["build"]
run = 'sh Tests/smoke.sh "$BUILD_DIR/$APP_NAME.app/Contents/MacOS/airdrop"'

[tasks.clean]
description = "remove build artifacts"
run = 'rm -rf "$BUILD_DIR"'

[tasks.bump]
description = "bump CFBundleShortVersionString in Info.plist (usage: mise run bump 0.3.0)"
run = '''
NEW_VERSION="${1:-}"
if [ -z "$NEW_VERSION" ]; then
    echo "usage: mise run bump <version>" >&2
    exit 1
fi
if ! echo "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
    echo "error: version must be in X.Y.Z form, got '$NEW_VERSION'" >&2
    exit 1
fi
/usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEW_VERSION" Info.plist
echo "Info.plist CFBundleShortVersionString → $NEW_VERSION"
'''

[tasks.update-tap]
description = "rewrite the homebrew formula to point at a new release (usage: mise run update-tap 0.3.0)"
env = { TAP_DIR = "{{env.HOME}}/dev/personal/homebrew-tap" }
run = '''
VERSION="${1:-}"
if [ -z "$VERSION" ]; then
    echo "usage: mise run update-tap <version>" >&2
    exit 1
fi
if [ ! -d "$TAP_DIR" ]; then
    echo "error: tap directory not found at $TAP_DIR" >&2
    echo "set TAP_DIR env var to override the location" >&2
    exit 1
fi
URL="https://github.com/mihaicrisan04/airdrop/archive/refs/tags/v${VERSION}.tar.gz"
echo "fetching $URL"
SHA=$(curl -fsSL "$URL" | shasum -a 256 | awk '{print $1}')
if [ -z "$SHA" ]; then
    echo "error: failed to fetch tarball; is v${VERSION} pushed and the workflow done?" >&2
    exit 1
fi
FORMULA="$TAP_DIR/Formula/airdrop.rb"
sed -i '' -E "s|archive/refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+\\.tar\\.gz|archive/refs/tags/v${VERSION}.tar.gz|" "$FORMULA"
sed -i '' -E "s|sha256 \"[a-f0-9]+\"|sha256 \"${SHA}\"|" "$FORMULA"
echo "updated $FORMULA → v${VERSION} (sha256 ${SHA})"
echo "review with: git -C $TAP_DIR diff Formula/airdrop.rb"
echo "publish with: git -C $TAP_DIR commit -am 'airdrop v${VERSION}' && git -C $TAP_DIR push"
'''
