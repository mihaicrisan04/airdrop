name: bug report
description: report a bug in airdrop
labels: ["bug"]
body:
  - type: input
    id: airdrop-version
    attributes:
      label: airdrop version
      description: output of `ad --version`
      placeholder: "ad 0.2.0"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: "Apple menu → About This Mac"
      placeholder: "macOS 26.5 (Tahoe)"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: mac chip
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: install method
      options:
        - Homebrew tap
        - Built from source (`mise run install`)
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: what happened?
      description: what you did, what you expected, what you got. include the exact `ad` command and any output.
    validations:
      required: true
